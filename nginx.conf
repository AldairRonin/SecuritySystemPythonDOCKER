
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth {
        proxy_pass http://backend:8000;
    }

    location /qr-codes {
        proxy_pass http://backend:8000;
    }

    location /guardian-students {
        proxy_pass http://backend:8000;
    }

    location /students {
        proxy_pass http://backend:8000;
    }

    location /verification-requests {
        proxy_pass http://backend:8000;
    }

    location /users {
        proxy_pass http://backend:8000;
    }

    location /access-logs {
        proxy_pass http://backend:8000;
    }
}
